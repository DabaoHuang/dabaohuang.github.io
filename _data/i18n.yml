  projects:
    title: Projects
    intro: System stabilization work for business owners with unstable, hard-to-maintain, process-heavy websites, admin panels, and operations systems.
    hero_eyebrow: System Stabilization
    hero_title: Running is not the same as being reliable
    hero_text: I help turn unstable, hard-to-maintain, process-heavy systems into maintainable architecture that can keep operating, be handed off, and launch safely.
    hero_primary_cta: Discuss your system
    hero_secondary_cta: View case study
    hero_points_label: Service focus
    hero_points:
      - Focused development for real technical issues
      - Architecture planning for maintainable systems
      - Safer launches for reliable operations
    hero_image_alt: Dabao system stabilization service visual
    background_eyebrow: Technical Background
    background_title: Developer + DevOps, from product features to deployment and operations
    background_text: I do not only build screens or only maintain servers. I connect product features, backend flows, databases, deployment, and operations so projects can be delivered and handed off clearly.
    background_image_alt: Developer and DevOps technical background integration visual
    background_items:
      - title: Developer
        text: Frontend pages, backend workflows, APIs, databases, admin panels, and import/export flows.
      - title: DevOps
        text: Linux, AWS, Docker, deployment workflows, backups, monitoring, and CI/CD improvements.
      - title: Delivery
        text: Requirement breakdown, data-flow cleanup, test planning, launch runbooks, and handoff notes.
    pain_eyebrow: Pain Points
    pain_title: Is your system running into these problems?
    pain_text: Business owners usually do not just need another feature. The real cost is unstable workflows that keep interrupting operations.
    pain_image_alt: Common system pain points visual
    pains:
      - title: Unstable system behavior
        text: The site slows down, fails under load, or breaks at the worst time.
      - title: Payments and orders drift apart
        text: Payment succeeds, but order or back-office status does not match.
      - title: Legacy system fear
        text: Everyone knows it needs work, but each change feels risky.
      - title: Traffic pressure breaks workflows
        text: More users or more operations quickly expose hidden bottlenecks.
    approach_eyebrow: Our Approach
    approach_title: How I make systems stable again
    approach_text: I clarify the problem first, then organize workflows, data, and code structure before reducing launch risk with tests and handoff notes.
    approach_steps:
      - title: System audit
        text: Map current behavior, recurring errors, data flow, and operational risk.
      - title: Workflow cleanup
        text: Break payment, order, admin, and manual steps into understandable flows.
      - title: Structure rebuild
        text: Refactor risky areas so future changes are not guesswork.
      - title: Test and launch
        text: Protect production with tests, documentation, and a launch runbook.
    case_eyebrow: Case Study
    case_client: CLIENT · Cross-border ecommerce logistics
    case_title: "Case study: Cross-border logistics system refactor"
    case_summary: From an aging logistics system to maintainable operations architecture.
    case_metric_stability: System stability
    case_metric_operations: Operations flow
    case_cta: Read full case study
    case_before_title: Before
    case_before_signal: Hard to change, hard to trace, high risk
    case_after_title: After
    case_after_signal: Maintainable, testable, handoff-ready
    case_before:
      - Payment and order status were frequently inconsistent
      - Legacy data could not be safely connected
      - Back-office work depended on manual judgment
      - Launch and regression risk remained high
    case_after:
      - Payment, order, and admin status became consistent
      - Legacy data can be imported, queried, and traced
      - Back-office workflows became clearer and controllable
      - Tests and runbooks reduced launch risk
    capability_eyebrow: Core Capability
    capability_title: My core capability and differentiation
    capability_text: I do not just ship features. I organize requirements, data, workflows, deployment, and operational risk so the business receives a system that can keep running.
    capability_about_title: How I work
    capability_about_text: My background combines Developer and DevOps work, so I can reason about product requirements, code structure, data flow, and production environments together. When dealing with legacy systems, payment flows, admin operations, and launch risk, I do not only fix isolated issues. I organize the operating workflow behind them.
    capability_points:
      - I can discuss business needs and turn them into executable engineering stages
      - I can handle frontend, backend, deployment, and operations without heavy handoff friction
      - I care about tests, documentation, and handoff so the project remains maintainable
    capabilities:
      - title: Legacy cleanup and refactor
        text: Separate tangled pages, SQL, and business logic to reduce change risk.
      - title: Payment, order, and admin integration
        text: Keep payment, order, invoice, reporting, and admin status aligned.
      - title: Stability and launch control
        text: Add tests, checks, and launch documentation so production is not run from memory.
    scenario_eyebrow: For You
    scenario_title: I can help if this sounds familiar
    scenario_image_alt: Dabao helping organize system workflows
    scenarios:
      - title: The system is harder to change every month
        text: Each new feature might affect something unrelated.
      - title: Payments do not reconcile
        text: Payment, order, and admin statuses often disagree.
      - title: Workflows depend on manual work
        text: People keep judging edge cases and patching data by hand.
      - title: The legacy system feels risky to touch
        text: You know it needs a refactor but worry about operations.
    process_title: Collaboration Process
    process_eyebrow: Work Process
    process_intro: You do not need a complete spec at the beginning. I help clarify the problem first, then align scope, quote, negotiable tradeoffs, stages, acceptance criteria, and launch steps.
    process_image_alt: Collaboration process visual from initial discussion, scope alignment, quote confirmation, delivery, launch, and handoff
    process:
      - title: 1. Initial discussion
        text: Understand the current situation and assess the problem.
      - title: 2. Scope alignment
        text: Clarify goals, pages, workflows, data sources, and deliverables.
      - title: 3. Quote and terms
        text: Provide a quote based on scope and discuss budget, timeline, and tradeoffs.
      - title: 4. Staged delivery
        text: Deliver and test in stages with regular progress updates.
      - title: 5. Launch and handoff
        text: Launch, verify, and prepare handoff documentation.
    contact_eyebrow: Contact
    contact_title: Contact
    contact_text: You do not need a complete spec first. Share the problem, the rough system state, and what you want to improve.
    contact_email_cta: Email me
  seo:
    fallback_description: "Technical notes by Dabao Huang on web development, DevOps, Linux, AWS, Git, and full-stack engineering."

