    intro: 不安定で保守しづらい Web サイト、管理画面、業務システムを、運用し続けられる形に整理します。
    hero_eyebrow: System Stabilization
    hero_title: 動いていることと、支えられることは違います
    hero_text: 不安定で保守しづらく、業務フローが複雑になったシステムを、運用、引き継ぎ、安全な公開まで考えた構成へ整理します。
    hero_primary_cta: システムについて相談する
    hero_secondary_cta: 事例を見る
    hero_points_label: サービスの重点
    hero_points:
      - 技術課題に集中した開発
      - 保守しやすい構成の設計
      - 安定した公開と運用
    hero_image_alt: Dabao のシステム安定化サービスのビジュアル
    background_eyebrow: Technical Background
    background_title: Developer + DevOps、機能開発からデプロイと運用まで
