    background_items:
      - title: Developer
        text: フロントエンド、バックエンド、API、データベース、管理画面、データ入出力。
      - title: DevOps
        text: Linux、AWS、Docker、デプロイ、バックアップ、監視、CI/CD 改善。
      - title: Delivery
        text: 要件整理、データフロー、テスト計画、公開 runbook、引き継ぎ資料。
    pain_eyebrow: Pain Points
    pain_title: このような問題はありませんか？
    pain_text: 必要なのは単なる新機能ではなく、日々の運用を止める不安定な流れを整理することかもしれません。
    pain_image_alt: よくあるシステム課題のビジュアル
    pains:
      - title: システムが不安定
        text: 忙しい時に遅くなり、利用者が増えるとエラーが出る。
      - title: 決済と注文が合わない
        text: 決済は成功しているのに、注文や管理画面の状態が一致しない。
      - title: 古いシステムを触れない
        text: 直す必要は分かっていても、変更の影響範囲が読めない。
      - title: アクセスや作業量に耐えられない
        text: 利用者や業務量が増えると、隠れていた問題が表面化する。
    approach_eyebrow: Our Approach
    approach_title: システムを安定させる進め方
    approach_text: 問題を先に整理し、業務フロー、データ、コード構造を段階的に見直し、テストと引き継ぎで公開リスクを下げます。
    approach_steps:
      - title: システム調査
        text: 現状、よく起きるエラー、データの流れ、運用リスクを整理します。
      - title: フロー整理
        text: 決済、注文、管理画面、手作業を分かる単位に分解します。
      - title: 構造の再設計
        text: リスクの高い部分をリファクタリングし、変更しやすくします。
      - title: テストと公開
        text: テスト、ドキュメント、公開手順で本番環境を守ります。
    case_eyebrow: Case Study
    case_client: CLIENT · 越境 EC 物流
    case_title: 事例：越境物流システムのリファクタリング
    case_summary: 古い物流システムを、保守しやすい運用基盤へ整理しました。
    case_metric_stability: システム安定性
    case_metric_operations: 運用フロー
    case_cta: 事例を読む
    case_before_title: Before
    case_before_signal: 変更しづらく、追跡しづらく、リスクが高い
    case_after_title: After
    case_after_signal: 保守、検証、引き継ぎがしやすい
    case_before:
      - 決済と注文状態が頻繁に不一致
      - 既存データを安全に接続しづらい
      - 管理画面の作業が人の判断に依存
      - 公開と回帰のリスクが高い
    case_after:
      - 決済、注文、管理画面の状態を一致
      - 既存データを移行、検索、追跡可能に
      - 管理画面の流れを分かりやすく制御
      - テストと runbook で公開リスクを低減
    capability_eyebrow: Core Capability
    capability_title: 私の強みと差別化
    capability_text: 機能を作るだけでなく、要件、データ、業務フロー、デプロイ、運用リスクまで整理し、長く使えるシステムにします。
    capability_about_title: 私の進め方
    capability_about_text: Developer と DevOps の両方の背景があるため、要件、コード構造、データフロー、本番環境を一緒に見て判断できます。既存システム、決済、管理画面、公開リスクを扱う時も、単発の修正ではなく、運用フロー全体を整理します。
    capability_points:
      - 業務要件を話し合い、実装可能な段階に分解できます
      - フロントエンド、バックエンド、デプロイ、運用まで一貫して扱えます
      - テスト、ドキュメント、引き継ぎを重視し、保守しやすい状態にします
    capabilities:
