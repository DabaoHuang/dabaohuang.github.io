    hero_eyebrow: 系統穩定服務
    hero_title: 系統能跑，不代表撐得住
    hero_text: 我幫你把不穩定、難維護、流程混亂的系統，整理成能持續營運、能交接、能安全上線的架構。
    hero_primary_cta: 先聊系統狀況
    hero_secondary_cta: 看完整案例
    hero_points_label: 服務重點
    hero_points:
      - 專注開發：解決技術問題
      - 架構規劃：設計可維護方案
      - 穩定上線：讓系統可靠運行
    hero_image_alt: 大寶的系統穩定服務主視覺
    background_eyebrow: Technical Background
    background_title: Developer + DevOps，從功能開發到部署維運一起處理
    background_text: 我不是只做畫面或只管主機，而是能把網站功能、後端流程、資料庫、部署與維運放在同一張圖上思考，讓專案更容易落地與交接。
    background_image_alt: Developer 與 DevOps 技術背景整合示意圖
    background_items:
      - title: Developer
        text: 前端頁面、後端流程、API、資料庫、管理後台與資料匯入匯出。
      - title: DevOps
        text: Linux、AWS、Docker、部署流程、備份、監控與 CI/CD 改善。
      - title: Delivery
        text: 需求拆解、資料流整理、測試規劃、上線 runbook 與交接文件。
    pain_eyebrow: Pain Points
    pain_title: 你的系統，是否也遇到這些問題？
    pain_text: 業主通常不是缺一個新功能，而是有些關鍵流程一直不穩，讓營運每天都在補洞。
    pain_image_alt: 常見系統痛點視覺圖
    pains:
      - title: 系統不穩定
        text: 一忙就卡、一多人就慢，偶爾還會出錯。
      - title: 金流與訂單不同步
        text: 付款成功但訂單狀態錯誤，帳務對不起來。
      - title: 舊系統不敢動
        text: 牽一髮動全身，不知道從哪裡開始整理。
      - title: 流量壓力撐不住
        text: 流量或作業量一上來，系統就開始出問題。
    approach_eyebrow: Our Approach
    approach_title: 我如何讓系統穩定下來
    approach_text: 先把問題拆清楚，再逐步整理流程、資料與程式結構，最後用測試與交接降低上線風險。
    approach_steps:
      - title: 系統盤點
        text: 釐清現況、常見錯誤、資料流與營運風險。
      - title: 流程整理
        text: 把金流、訂單、後台與人工流程拆成可理解的步驟。
      - title: 結構重建
        text: 重構高風險區塊，讓後續維護不再靠猜。
      - title: 測試與上線
        text: 用測試、文件與 runbook 保護正式上線。
    case_eyebrow: Case Study
    case_client: CLIENT · 跨境電商物流
    case_title: 實際案例：跨境物流系統重構
    case_summary: 從老舊物流系統，到可維護的營運架構。
    case_metric_stability: 系統穩定度
    case_metric_operations: 營運流程
    case_cta: 閱讀完整案例
    case_before_title: 原本問題
    case_before_signal: 難改、難查、風險高
    case_after_title: 專案成果
    case_after_signal: 可維護、可驗證、可交接
    case_before:
      - 金流與訂單狀態長期不穩
      - 舊資料無法安全銜接
      - 後台流程依賴人工判斷
      - 系統上線與回歸風險高
    case_after:
      - 金流、訂單與後台狀態穩定一致
      - 舊資料可重新匯入、查詢與追蹤
      - 後台流程變得清楚可控
      - 用測試與 runbook 降低上線風險
    capability_eyebrow: Core Capability
    capability_title: 我的核心能力與差異化
    capability_text: 我不是只把功能做出來，而是把需求、資料、流程、部署與維運風險一起整理，讓業主得到一個能長期營運的系統。
    capability_about_title: 關於我的做事方式
    capability_about_text: 我有 Developer 與 DevOps 的混合背景，能同時看懂產品需求、程式結構、資料流與正式環境。這讓我在處理舊系統、金流流程、後台作業與上線風險時，不會只修單點問題，而是把背後的營運流程一起整理清楚。
    capability_points:
      - 能和業主討論需求，也能拆成工程可執行的階段
      - 能處理前後端與部署維運，不需要多方轉譯
      - 重視測試、文件與交接，避免專案完成後沒人敢維護
    capabilities:
      - title: 舊系統整理與重構
        text: 把混在一起的頁面、SQL、流程邏輯拆清楚，降低每次修改的風險。
      - title: 金流、訂單、後台整合
        text: 讓付款、訂單、發票、報表與後台狀態能對得起來。
      - title: 穩定性與上線控管
        text: 補上測試、檢查流程與上線文件，讓正式環境不靠記憶操作。
    scenario_eyebrow: For You
    scenario_title: 如果你遇到這些情況，我可以幫上忙
    scenario_image_alt: 大寶協助整理系統流程的情境圖
    scenarios:
      - title: 系統越來越難改
        text: 每次新增功能都怕影響其他地方。
      - title: 金流對不上帳
        text: 付款、訂單、後台狀態經常不同步。
      - title: 流程依賴人工
        text: 很多步驟需要人手動判斷與補資料。
      - title: 舊系統不敢動
        text: 知道要重構，但擔心影響營運。
    process_title: 合作方式
    process_eyebrow: Work Process
    process_intro: 你不需要一開始就準備完整規格。我會先協助整理問題，再把範圍、報價、調整空間、階段、驗收與上線方式講清楚。
    process_image_alt: 從初步討論、範圍整理、報價確認到上線交接的合作流程示意圖
    process:
      - title: 1. 初步討論
        text: 了解現狀與需求，初步評估問題。
      - title: 2. 範圍整理
        text: 把目標、頁面、流程、資料來源與交付內容整理清楚。
      - title: 3. 報價與條件確認
        text: 依照範圍提供報價，討論預算、時程與可調整項目。
      - title: 4. 分階段交付
        text: 分階段開發與測試，定期回報進度。
      - title: 5. 上線與交接
        text: 系統上線與驗證，整理文件與交接。
    contact_eyebrow: Contact
    contact_title: Contact
    contact_text: 不需要先整理完整規格。你可以先告訴我目前遇到的問題、系統大概狀況，以及希望改善的方向。
    contact_email_cta: Email 我
  seo:
    fallback_description: "Dabao Huang 的技術筆記，記錄 Web Development、DevOps、Linux、AWS、Git 與全端開發實務。"

